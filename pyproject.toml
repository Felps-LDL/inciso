[project]
name = "inciso"
version = "0.0.1"
description = "Busca com RAG sobre documentos normativos financeiros brasileiros, com qualidade de recuperação medida."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "pypdf>=7.1.0",
]

[dependency-groups]
dev = [
    "poethepoet",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Travessão e ordinal são marcadores reais do texto normativo ("I – ...", "Art. 1º").
allowed-confusables = ["–", "—", "º"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Lint com ruff" }
fmt = { cmd = "ruff format .", help = "Formata o código" }
fmt-check = { cmd = "ruff format --check .", help = "Confere a formatação sem alterar" }
test = { cmd = "pytest", help = "Roda os testes" }
check = { sequence = ["lint", "fmt-check", "test"], help = "Tudo que o CI roda, na mesma ordem" }
ingerir = { cmd = "python -m inciso.ingestao", help = "Ingere os PDFs de corpus/ no banco" }
chunkear = { cmd = "python -m inciso.chunking", help = "Gera os chunks de tamanho fixo no banco" }
db = { cmd = "docker compose up -d --wait", help = "Sobe o Postgres + pgvector local" }
db-parar = { cmd = "docker compose stop", help = "Para o Postgres local (mantém os dados)" }
db-apagar = { cmd = "docker compose down -v", help = "Remove o Postgres local e os dados" }
